<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#22301F">
<title>Reel tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Archivo', sans-serif; background: #FAF5EA; color: #22301F; min-height: 100vh; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
  #app { max-width: 480px; margin: 0 auto; padding-bottom: 100px; }

  header { background: #22301F; padding: 20px 20px 16px; padding-top: calc(20px + env(safe-area-inset-top)); position: sticky; top: 0; z-index: 5; }
  .header-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header h1 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.03em; font-size: clamp(24px, 5vw, 30px); color: #FAF5EA; }
  header p { font-size: 12px; color: #C08A2E; margin-top: 2px; }
  .signout { background: none; border: 1px solid #445240; color: #C08A2E; font-size: 11px; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-family: 'Archivo'; }
  .signout:hover { opacity: 0.8; }

  .offline-banner { background: #F1E9D6; color: #22301F; font-size: 12px; text-align: center; padding: 8px 16px; }

  .stats { display: flex; gap: 8px; padding: 14px 16px 4px; }
  .stat { flex: 1; background: #F1E9D6; border-radius: 10px; padding: 10px 8px; text-align: center; }
  .stat .n { font-size: 20px; font-weight: 600; }
  .stat .l { font-size: 10px; color: #22301F; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.04em; }

  .filter-row { display: flex; gap: 6px; padding: 10px 16px 0; flex-wrap: wrap; }
  .filter-btn { font-size: 11px; padding: 6px 12px; border-radius: 999px; border: 1px solid #e5ddc8; background: #FAF5EA; color: #22301F; opacity: 0.6; cursor: pointer; }
  .filter-btn.active { opacity: 1; font-weight: 600; background: #22301F; color: #FAF5EA; border-color: transparent; }

  .list { padding: 8px 16px; display: flex; flex-direction: column; gap: 10px; }
  .empty { text-align: center; padding: 60px 20px; color: #22301F; opacity: 0.55; font-size: 14px; }

  .card { background: #fff; border: 1px solid #eee2c9; border-radius: 12px; padding: 14px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .code { display: inline-block; font-size: 10px; font-weight: 600; color: #C08A2E; background: #FAF5EA; border: 1px solid #eee2c9; border-radius: 5px; padding: 2px 6px; letter-spacing: 0.03em; margin-bottom: 4px; }
  .card-title { font-weight: 600; font-size: 15px; }
  .card-hook { font-size: 13px; color: #22301F; opacity: 0.7; margin-top: 3px; font-style: italic; }
  .card-notes { font-size: 12px; color: #22301F; opacity: 0.6; margin-top: 6px; white-space: pre-wrap; }
  .card-actions { display: flex; gap: 2px; }
  .del, .edit { background: none; border: none; font-size: 14px; cursor: pointer; padding: 2px 6px; }
  .del { font-size: 16px; color: #22301F; }
  .edit { color: #C08A2E; }
  .del:hover, .edit:hover { opacity: 0.7; }

  .stage-row { display: flex; gap: 4px; margin-top: 12px; }
  .stage-btn { flex: 1; font-size: 10px; padding: 7px 2px; border-radius: 6px; border: 1px solid #e5ddc8; background: #FAF5EA; color: #22301F; opacity: 0.5; cursor: pointer; text-align: center; }
  .stage-btn.active { opacity: 1; font-weight: 600; border-color: transparent; }
  .stage-btn.s0.active { background: #F1E9D6; }
  .stage-btn.s1.active { background: #e9d5b0; }
  .stage-btn.s2.active { background: #C97A5D; color: #fff; }
  .stage-btn.s3.active { background: #C08A2E; color: #fff; }
  .stage-btn.s4.active { background: #22301F; color: #FAF5EA; }

  .fab { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #C08A2E; color: #fff; border: none; border-radius: 999px; padding: 14px 28px; font-family: 'Archivo'; font-weight: 600; font-size: 14px; box-shadow: 0 4px 14px rgba(34,48,31,0.25); cursor: pointer; }

  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(34,48,31,0.5); align-items: flex-end; justify-content: center; z-index: 20; }
  .modal-bg.open { display: flex; }
  .modal { background: #FAF5EA; width: 100%; max-width: 480px; border-radius: 16px 16px 0 0; padding: 20px; }
  .modal h2 { font-family: 'Bebas Neue'; font-size: 20px; margin-bottom: 14px; letter-spacing: 0.02em; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.6; margin-bottom: 4px; }
  .field input, .field textarea, .field select { width: 100%; border: 1px solid #ddd2ae; border-radius: 8px; padding: 10px; font-family: 'Archivo'; font-size: 14px; background: #fff; color: #22301F; }
  .field textarea { resize: none; height: 50px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-family: 'Archivo'; font-weight: 600; font-size: 14px; cursor: pointer; }
  .btn-cancel { background: #F1E9D6; color: #22301F; }
  .btn-save { background: #22301F; color: #FAF5EA; }

  .loading { text-align: center; padding: 40px; opacity: 0.5; font-size: 13px; }

  #gate { position: fixed; inset: 0; background: #22301F; display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  #gate.hidden { display: none; }
  .gate-box { max-width: 300px; width: 100%; text-align: center; }
  .gate-box h1 { font-family: 'Bebas Neue', sans-serif; color: #FAF5EA; font-size: 26px; letter-spacing: 0.03em; margin-bottom: 20px; }
  .gate-loading { color: #FAF5EA; opacity: 0.6; font-size: 13px; }
  .gate-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #445240; background: #2c3d27; color: #FAF5EA; font-family: 'Archivo'; font-size: 15px; text-align: center; margin-bottom: 10px; }
  .gate-box input::placeholder { color: #8a9285; }
  .gate-box button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #C08A2E; color: #fff; font-family: 'Archivo'; font-weight: 600; font-size: 14px; cursor: pointer; }
  .gate-box button.gate-alt { background: transparent; border: 1px solid #C08A2E; color: #C08A2E; margin-top: 8px; }
  .gate-error { color: #C97A5D; font-size: 12px; margin-top: 10px; min-height: 14px; }

  .fab { padding-bottom: calc(14px + env(safe-area-inset-bottom)); bottom: calc(24px + env(safe-area-inset-bottom)); }

  @media (min-width: 640px) {
    #app { max-width: 720px; }
    .list { grid-template-columns: 1fr 1fr; display: grid; }
    .stats { max-width: 720px; }
    .modal-bg { align-items: center; }
    .modal { max-width: 420px; border-radius: 16px; }
  }
  @media (min-width: 1024px) {
    #app { max-width: 960px; }
    .list { grid-template-columns: 1fr 1fr 1fr; }
    .stats { max-width: 960px; }
  }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>Little Valie Atelier</h1>
    <div class="gate-loading" id="gateLoading">Loading…</div>
    <div class="gate-form" id="gateForm" style="display:none">
      <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
      <button onclick="handleSignIn()">Sign in</button>
      <button class="gate-alt" onclick="handleSignUp()">Create account</button>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="header-top">
      <h1>Reel tracker</h1>
      <button class="signout" onclick="handleSignOut()">Sign out</button>
    </div>
    <p>Little Valie Atelier — Tried &amp; Tested</p>
  </header>
  <div class="offline-banner" id="offlineBanner" hidden>You're offline — showing cached reels. Changes will sync once you're back online.</div>
  <div class="stats" id="stats"></div>
  <div class="filter-row" id="filterRow"></div>
  <div class="list" id="list"><div class="loading">Loading your reels…</div></div>
</div>


<button class="fab" onclick="openModal()">+ New reel</button>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">New reel</h2>
    <div class="field">
      <label>Product / title</label>
      <input id="fTitle" placeholder="Insta360 Hello Kitty review">
    </div>
    <div class="field">
      <label>Stage</label>
      <select id="fStage"></select>
    </div>
    <div class="field">
      <label>Hook line</label>
      <textarea id="fHook" placeholder="I run a slow-design brand... and then this showed up."></textarea>
    </div>
    <div class="field">
      <label>Notes</label>
      <textarea id="fNotes" placeholder="Props needed, filming location, edit ideas..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveReel()">Save reel</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAqTuo__DExYIyPtF9s--I9zMXHHiXX_XY",
  authDomain: "little-valie-atelier.firebaseapp.com",
  projectId: "little-valie-atelier",
  storageBucket: "little-valie-atelier.firebasestorage.app",
  messagingSenderId: "906948076865",
  appId: "1:906948076865:web:b7242a4564514957a26dc0",
  measurementId: "G-03JPK496HZ"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(err => {
  console.warn('Offline persistence unavailable:', err.code);
});

const STAGES = ['Idea','Scripted','Filming','Editing','Posted'];
let reels = [];
let nextNum = 1;
let stageFilter = 'all';
let editingId = null;
let currentUser = null;
let isOffline = false;
let unsubReels = null;
let unsubCounter = null;

function populateStageSelect() {
  document.getElementById('fStage').innerHTML = STAGES.map((s, i) => `<option value="${i}">${s}</option>`).join('');
}
populateStageSelect();

document.getElementById('authEmail').addEventListener('keydown', e => { if (e.key === 'Enter') handleSignIn(); });
document.getElementById('authPassword').addEventListener('keydown', e => { if (e.key === 'Enter') handleSignIn(); });

function initAuth() {
  auth.onAuthStateChanged(user => {
    document.getElementById('gateLoading').style.display = 'none';
    document.getElementById('gateForm').style.display = 'block';
    if (user) {
      currentUser = user;
      showApp();
    } else {
      currentUser = null;
      teardownListeners();
      showGate();
    }
  });
}

function teardownListeners() {
  if (unsubReels) { unsubReels(); unsubReels = null; }
  if (unsubCounter) { unsubCounter(); unsubCounter = null; }
}

function showGate() {
  document.getElementById('gate').classList.remove('hidden');
  document.getElementById('app').style.display = 'none';
  document.getElementById('authPassword').value = '';
}

function showApp() {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  subscribeReels();
  subscribeCounter();
  prefillFromQuery();
}

function clearAuthError() {
  document.getElementById('gateError').textContent = '';
}

function authErrorMessage(err) {
  return err && err.message ? err.message : 'Something went wrong, try again.';
}

function handleSignIn() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  clearAuthError();
  auth.signInWithEmailAndPassword(email, password).catch(err => {
    document.getElementById('gateError').textContent = authErrorMessage(err);
  });
}

function handleSignUp() {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  clearAuthError();
  auth.createUserWithEmailAndPassword(email, password).catch(err => {
    document.getElementById('gateError').textContent = authErrorMessage(err);
  });
}

function handleSignOut() {
  auth.signOut();
}

function prefillFromQuery() {
  const params = new URLSearchParams(window.location.search);
  if (!params.has('title') && !params.has('hook') && !params.has('notes') && !params.has('stage')) return;

  openModal();
  if (params.has('title')) document.getElementById('fTitle').value = params.get('title');
  if (params.has('hook')) document.getElementById('fHook').value = params.get('hook');
  if (params.has('notes')) document.getElementById('fNotes').value = params.get('notes');
  if (params.has('stage')) {
    const stageIdx = parseInt(params.get('stage'), 10);
    if (!isNaN(stageIdx) && stageIdx >= 0 && stageIdx < STAGES.length) {
      document.getElementById('fStage').value = stageIdx;
    }
  }
}

function setOffline(fromCache) {
  if (fromCache === isOffline) return;
  isOffline = fromCache;
  document.getElementById('offlineBanner').hidden = !isOffline;
}

function subscribeReels() {
  const ref = db.collection('users').doc(currentUser.uid).collection('reels').orderBy('createdAt', 'desc');
  unsubReels = ref.onSnapshot(snapshot => {
    reels = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    setOffline(snapshot.metadata.fromCache);
    render();
  }, err => {
    console.error('Reels listener error', err);
  });
}

function subscribeCounter() {
  const ref = db.collection('users').doc(currentUser.uid);
  unsubCounter = ref.onSnapshot(doc => {
    nextNum = (doc.exists && doc.data().nextReelNum) ? doc.data().nextReelNum : 1;
  }, err => {
    console.error('Counter listener error', err);
  });
}

function openModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'New reel';
  document.getElementById('fTitle').value = '';
  document.getElementById('fStage').value = 0;
  document.getElementById('fHook').value = '';
  document.getElementById('fNotes').value = '';
  document.getElementById('fTitle').style.borderColor = '';
  document.getElementById('modalBg').classList.add('open');
}

function openEditModal(id) {
  const r = reels.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit reel';
  document.getElementById('fTitle').value = r.title;
  document.getElementById('fStage').value = r.stage;
  document.getElementById('fHook').value = r.hook || '';
  document.getElementById('fNotes').value = r.notes || '';
  document.getElementById('fTitle').style.borderColor = '';
  document.getElementById('modalBg').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
}

function saveReel() {
  const title = document.getElementById('fTitle').value.trim();
  if (!title) {
    document.getElementById('fTitle').style.borderColor = '#C97A5D';
    return;
  }
  const hook = document.getElementById('fHook').value.trim();
  const notes = document.getElementById('fNotes').value.trim();
  const stage = parseInt(document.getElementById('fStage').value, 10);
  const userRef = db.collection('users').doc(currentUser.uid);

  if (editingId) {
    userRef.collection('reels').doc(editingId).update({ title, stage, hook, notes }).catch(err => {
      console.error('Save failed', err);
    });
  } else {
    const code = 'LVA-' + String(nextNum).padStart(3, '0');
    const reelRef = userRef.collection('reels').doc();
    const batch = db.batch();
    batch.set(reelRef, { code, title, hook, notes, stage, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    batch.set(userRef, { nextReelNum: nextNum + 1 }, { merge: true });
    nextNum += 1;
    batch.commit().catch(err => {
      console.error('Save failed', err);
    });
  }
  closeModal();
}

function setStage(id, stage) {
  db.collection('users').doc(currentUser.uid).collection('reels').doc(id).update({ stage }).catch(err => {
    console.error('Stage update failed', err);
  });
}

function deleteReel(id) {
  db.collection('users').doc(currentUser.uid).collection('reels').doc(id).delete().catch(err => {
    console.error('Delete failed', err);
  });
}

function setFilter(stage) {
  stageFilter = stage;
  render();
}

function render() {
  const list = document.getElementById('list');
  const stats = document.getElementById('stats');
  const filterRow = document.getElementById('filterRow');

  const posted = reels.filter(r => r.stage === 4).length;
  const inProgress = reels.length - posted;
  stats.innerHTML = `
    <div class="stat"><div class="n">${reels.length}</div><div class="l">Total</div></div>
    <div class="stat"><div class="n">${inProgress}</div><div class="l">In progress</div></div>
    <div class="stat"><div class="n">${posted}</div><div class="l">Posted</div></div>
  `;

  filterRow.innerHTML = `
    <button class="filter-btn ${stageFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">All</button>
    ${STAGES.map((s, i) => `<button class="filter-btn ${stageFilter === i ? 'active' : ''}" onclick="setFilter(${i})">${s}</button>`).join('')}
  `;

  const filtered = stageFilter === 'all' ? reels : reels.filter(r => r.stage === stageFilter);

  if (reels.length === 0) {
    list.innerHTML = '<div class="empty">No reels yet. Tap "New reel" to plan your first one.</div>';
    return;
  }
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty">No reels in this stage.</div>';
    return;
  }

  list.innerHTML = filtered.map(r => `
    <div class="card">
      <div class="card-top">
        <div>
          <div class="code">${r.code || 'LVA-000'}</div>
          <div class="card-title">${escapeHtml(r.title)}</div>
          ${r.hook ? `<div class="card-hook">"${escapeHtml(r.hook)}"</div>` : ''}
          ${r.notes ? `<div class="card-notes">${escapeHtml(r.notes)}</div>` : ''}
        </div>
        <div class="card-actions">
          <button class="edit" onclick="openEditModal('${r.id}')" aria-label="Edit">&#9998;</button>
          <button class="del" onclick="deleteReel('${r.id}')" aria-label="Delete">&times;</button>
        </div>
      </div>
      <div class="stage-row">
        ${STAGES.map((s, i) => `<button class="stage-btn s${i} ${r.stage === i ? 'active' : ''}" onclick="setStage('${r.id}', ${i})">${s}</button>`).join('')}
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

initAuth();
</script>

</body>
</html>
